name: GUVoice
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: K593X99M7G
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.17.0
targets:
  GUVoice:
    type: application
    platform: iOS
    sources:
      - App
      - path: Config/GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Production.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guvoice.guVoice
        CODE_SIGN_ENTITLEMENTS: Config/GUVoice.entitlements
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_PREPROCESS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        KIOSK_IDLE_TIMEOUT_SECONDS: "180"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GUVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: GUVoice
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.guvoice.guVoice.NativeTests
      GENERATE_INFOPLIST_FILE: YES
  GUVoiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GUVoice
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.guvoice.guVoice.KioskUITests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  GUVoice:
    build:
      targets:
        GUVoice: all
    test:
      targets: [GUVoiceTests, GUVoiceUITests]
