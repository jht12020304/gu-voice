name: CI

"on":
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Backend tests (FastAPI, Python 3.12)
  # Services are wired so later integration tests work without workflow
  # changes — current unit suite mostly uses stubs.
  # ──────────────────────────────────────────────────────────────────────
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      JWT_ALGORITHM: HS256
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      OPENAI_API_KEY: sk-test-placeholder
      SUPABASE_URL: http://localhost
      SUPABASE_SERVICE_ROLE_KEY: test-service-role

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt = requirements.txt + pinned pytest/pytest-asyncio.
          # pytest-asyncio is required — the async tests carry @pytest.mark.asyncio and
          # fail with "async def functions are not natively supported" without it.
          # This was silently red on main from 2026-08-23 until 2026-09-08.
          pip install -r requirements-dev.txt

      - name: Run pytest (unit)
        working-directory: backend
        run: pytest tests/unit -q --junitxml=pytest-results.xml

      - name: Test repository checks
        run: python -m pytest scripts/tests -q

      - name: Upload junit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-results
          path: backend/pytest-results.xml
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # Web checks (React/Vite/TS, Node 22)
  # `npm run build` already runs `tsc -b` first, so typecheck is implicit,
  # but we keep an explicit type-check step for faster failure surfacing.
  # ──────────────────────────────────────────────────────────────────────
  frontend-checks:
    name: frontend-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run type-check

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
          VITE_WS_BASE_URL: ws://localhost:8000/api/v1/ws
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────
  # iOS app checks (Flutter). React remains the maintained web client.
  #
  # Added 2026-07-26: CI had zero Flutter coverage, so an `unnecessary_underscores`
  # info slipped through review. `flutter analyze` exits 1 on info-level issues too
  # (verified), which is exactly what we want here.
  #
  # ubuntu is enough: analyze + unit tests need no Apple toolchain. iOS/Android
  # builds and `integration_test/` (needs a real simulator/device) stay local —
  # `flutter test` with no args only runs `test/`, so the integration suite is
  # naturally excluded rather than needing an ignore.
  # ──────────────────────────────────────────────────────────────────────
  flutter-checks:
    name: flutter-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Third-party action (de-facto standard for Flutter CI). Mutable tag; this job
      # has no secrets and only reads the repo, so the blast radius is a broken build.
      # Pin to a full commit SHA if that ever stops being true.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in step with the version used locally (`flutter --version`), so CI
          # and dev machines fail on the same lints.
          flutter-version: "3.41.3"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Test
        working-directory: flutter_app
        run: flutter test

      - name: Calendar across daylight saving changes
        working-directory: flutter_app
        env:
          TZ: America/New_York
        run: flutter test --no-pub test/session_calendar_test.dart

  # ──────────────────────────────────────────────────────────────────────
  # Web browser tests use the mocked API in playwright.config.ts.
  # ──────────────────────────────────────────────────────────────────────
  e2e-playwright:
    name: e2e-playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
